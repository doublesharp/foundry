name: forge-ds

# Builds the `forge-ds` binary and publishes it so other workflows can download it
# instead of compiling Foundry. Each build is published to two prereleases:
#
# - `forge-ds-<sha7>`: fixed to the built commit. Once published, its assets are
#   never replaced, so consumers should pin this tag and verify the `.sha256`.
# - `forge-ds`: rolling, moved to the branch head on every push build.
#
#   curl -fsSL https://github.com/<owner>/foundry/releases/download/forge-ds-<sha7>/forge-ds_linux_amd64.tar.gz | tar -xz
#
# Run the workflow manually with `ref` to publish a fixed release for an older
# commit without moving the rolling release.

permissions: {}

on:
  push:
    branches:
      - feature/viair-instrumented-coverage
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/forge-ds.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build. Defaults to the selected branch head.
        required: false
        default: ""

concurrency:
  group: forge-ds-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: forge-ds

jobs:
  resolve:
    if: github.repository != 'foundry-rs/foundry'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve commit
        id: resolve
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to the oldest runner images to support old libc/SDK versions.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: forge-ds-${{ matrix.target }}
          cache-on-failure: true

      - name: Apple Silicon setup
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          printf 'SDKROOT=%s\n' "$(xcrun -sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          printf 'MACOSX_DEPLOYMENT_TARGET=11.0\n' >> "$GITHUB_ENV"

      - name: Build forge-ds
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          features="forge-ds,asm-keccak,optimism"
          # `jemalloc` is not fully supported on aarch64 Linux.
          if [[ "$TARGET" != "aarch64-unknown-linux-gnu" ]]; then
            features="${features},jemalloc"
          fi
          cargo build --locked --release --target "$TARGET" \
            -p forge --bin forge-ds --no-default-features --features "$features"
          "target/$TARGET/release/forge-ds" --version

      - name: Archive binary
        env:
          TARGET: ${{ matrix.target }}
          FILE_NAME: forge-ds_${{ matrix.platform }}_${{ matrix.arch }}.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$FILE_NAME" -C "target/$TARGET/release" forge-ds
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$FILE_NAME" > "$FILE_NAME.sha256"
          else
            shasum -a 256 "$FILE_NAME" > "$FILE_NAME.sha256"
          fi
          cat "$FILE_NAME.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-ds_${{ matrix.platform }}_${{ matrix.arch }}
          path: forge-ds_${{ matrix.platform }}_${{ matrix.arch }}.tar.gz*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: forge-ds_*
          path: dist
          merge-multiple: true

      - name: Publish fixed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG-${SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$tag" dist/* --prerelease --latest=false \
            --target "$SHA" --title "forge-ds (${SHA:0:12})" \
            --notes "forge-ds built at $SHA. Assets are never replaced."

      - name: Publish rolling release
        # Only branch-head builds move the rolling release.
        if: needs.resolve.outputs.sha == github.sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          notes="forge-ds built from \`${REF_NAME}\` at ${GITHUB_SHA}. Rolling; pin \`forge-ds-${GITHUB_SHA:0:7}\` instead."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Move the existing tag to this commit, then replace the assets.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$RELEASE_TAG" --prerelease \
              --title "forge-ds ($short_sha)" --notes "$notes"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "forge-ds ($short_sha)" --notes "$notes"
          fi
