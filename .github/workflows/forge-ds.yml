name: forge-ds

# Builds the `forge-ds` binary and publishes it so other workflows can download it
# instead of compiling Foundry. Builds run only on demand:
#
# - Pushing any `forge-ds-*` tag builds the tagged commit and updates the latest
#   assets. The tagged commit must contain this workflow.
# - Running the workflow manually with `ref` builds any commit, including ones
#   older than this workflow, and updates the latest assets only if `rolling`.
#
# Every build is uploaded to the single `forge-ds` release, whose tag never moves:
#
# - `forge-ds-<sha7>_<platform>_<arch>.tar.gz` (+ `.sha256`): fixed to one commit
#   and never replaced. Downstream setup actions derive this name from the pinned
#   commit and check the `.sha256` and `Commit SHA` in `forge-ds --version`, so
#   keep the names and the `sha256sum` output format stable.
# - `forge-ds_<platform>_<arch>.tar.gz` (+ `.sha256`) and `forge-ds_latest.txt`:
#   the most recent rolling build and its commit.
#
# Uploading assets avoids creating releases or moving tags, which the workflow
# token may not do for commits whose workflow files differ from the running one.
#
#   curl -fsSL https://github.com/<owner>/foundry/releases/download/forge-ds/forge-ds-<sha7>_linux_amd64.tar.gz | tar -xz
#
# GitHub scopes caches to the ref a run starts on, and a tag run cannot read a
# branch's caches. A tag push therefore only dispatches the build on
# `CACHE_BRANCH`, so every build shares one dependency cache.

permissions: {}

on:
  push:
    tags:
      - "forge-ds-*"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build. Defaults to the selected branch head.
        required: false
        default: ""
      rolling:
        description: Also update the latest `forge-ds` assets to this build.
        type: boolean
        default: false

concurrency:
  group: forge-ds-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: forge-ds
  CACHE_BRANCH: feature/viair-instrumented-coverage

jobs:
  dispatch:
    if: github.repository != 'foundry-rs/foundry' && github.event_name == 'push'
    name: dispatch build on ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch cached build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run forge-ds.yml --ref "$CACHE_BRANCH" \
            -f ref="$GITHUB_SHA" -f rolling=true

  resolve:
    if: github.repository != 'foundry-rs/foundry' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      prefix: ${{ steps.resolve.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Resolve commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          printf 'sha=%s\nprefix=%s\n' "$sha" "$RELEASE_TAG-${sha:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to the oldest runner images to support old libc/SDK versions.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
      # Caches compiled dependencies; Foundry's own crates rebuild each time.
      # sccache was tried and dropped: most of its GitHub cache writes failed.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: forge-ds-${{ matrix.target }}
          cache-on-failure: true

      - name: Apple Silicon setup
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          printf 'SDKROOT=%s\n' "$(xcrun -sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          printf 'MACOSX_DEPLOYMENT_TARGET=11.0\n' >> "$GITHUB_ENV"

      - name: Build forge-ds
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          features="forge-ds,asm-keccak,optimism"
          # `jemalloc` is not fully supported on aarch64 Linux.
          if [[ "$TARGET" != "aarch64-unknown-linux-gnu" ]]; then
            features="${features},jemalloc"
          fi
          cargo build --locked --release --target "$TARGET" \
            -p forge --bin forge-ds --no-default-features --features "$features"
          "target/$TARGET/release/forge-ds" --version

      - name: Archive binary
        env:
          TARGET: ${{ matrix.target }}
          FILE_NAME: ${{ needs.resolve.outputs.prefix }}_${{ matrix.platform }}_${{ matrix.arch }}.tar.gz
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$FILE_NAME" -C "target/$TARGET/release" forge-ds
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$FILE_NAME" > "$FILE_NAME.sha256"
          else
            shasum -a 256 "$FILE_NAME" > "$FILE_NAME.sha256"
          fi
          cat "$FILE_NAME.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-ds_${{ matrix.platform }}_${{ matrix.arch }}
          path: ${{ needs.resolve.outputs.prefix }}_${{ matrix.platform }}_${{ matrix.arch }}.tar.gz*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: forge-ds_*
          path: dist
          merge-multiple: true

      - name: Upload fixed assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for file in dist/*; do
            if grep -qxF "$(basename "$file")" <<< "$existing"; then
              echo "$(basename "$file") already exists; leaving it unchanged."
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done

      - name: Update latest assets
        if: inputs.rolling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ needs.resolve.outputs.prefix }}
          SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir latest
          cd dist
          for file in "$PREFIX"_*.tar.gz; do
            name="$RELEASE_TAG${file#"$PREFIX"}"
            cp "$file" "../latest/$name"
            (cd ../latest && sha256sum "$name" > "$name.sha256")
          done
          printf '%s\n' "$SHA" > ../latest/forge-ds_latest.txt
          gh release upload "$RELEASE_TAG" ../latest/* --clobber
